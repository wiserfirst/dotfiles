onboarding = false
# herdr keybindings — Meh (ctrl+alt+shift) layer for workspace/tab navigation.
# Each action also carries an alt fallback in case the terminal
# mangles the Meh chord before it reaches the TUI.

[keys]
next_workspace     = ["ctrl+alt+shift+j", "alt+j"]
previous_workspace = ["ctrl+alt+shift+k", "alt+k"]
next_tab           = ["prefix+n", "ctrl+alt+shift+l", "alt+l"]
previous_tab       = ["prefix+p", "ctrl+alt+shift+h", "alt+h"]

# Indexed jumps: Meh+1..9 -> workspace N (Prime-style positional jumps).
# Default switch_tab = "prefix+1..9" stays active for tabs.
switch_workspace   = ["ctrl+alt+shift+1..9", "alt+1..9"]

# Copy mode (y = yank): direct chords alongside the prefix+[ default.
copy_mode          = ["prefix+[", "ctrl+alt+shift+y", "alt+y"]

# Back-and-forth toggle between the two most recent panes.
last_pane          = "alt+;"

# Agent jumps: cycle agent panes directly, across workspaces.
next_agent         = ["ctrl+alt+shift+n", "alt+n"]
previous_agent     = ["ctrl+alt+shift+p", "alt+p"]

# Sessionizer: prefix+f opens an fzf picker over repo dirs in a temporary
# pane; picking one creates-or-focuses that project's workspace.
[[keys.command]]
key = "prefix+f"
type = "pane"
command = "herdr-sessionizer"

[[keys.command]]
key = "alt+f"
type = "popup"
command = "herdr-sessionizer"

# Workspace picker: fzf over open workspaces only, focus the pick
# (never creates). Script lives in dotfiles/bin, symlinked to ~/.local/bin.
[[keys.command]]
key = "alt+w"
type = "popup"
command = "herdr-ws-picker"

# Sidebar agents as an attention queue (needs-input first) instead of
# grouped by space; pairs with the alt+n/alt+p agent jumps.
[ui]
agent_panel_sort = "priority"

# Sidebar spacing: 0.7.4 changed the default row_gap to 0; keep the
# old one-blank-row spacing between entries.
[ui.sidebar.spaces]
row_gap = 1

[ui.sidebar.agents]
row_gap = 1

[theme]
name = "solarized"
auto_switch = false
